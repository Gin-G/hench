# CI/CD: build + push both images on pushes to main, then bump the image tags
# in helm/hench/values.yaml. ArgoCD watches the chart and rolls out the change.
#
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
name: build-deploy

on:
  push:
    branches: [main]
    # Chart/manifest-only pushes (including this workflow's own tag-bump
    # commit) go straight to ArgoCD — no image rebuild needed.
    paths-ignore:
      - "helm/**"
      - "deploy/**"
      - "**.md"

concurrency:
  group: build-deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            image: ncging/hench-backend
          - component: frontend
            image: ncging/hench-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ env.TAG }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  bump-helm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tags in values.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          yq -i "
            .backend.image.tag = \"$TAG\" |
            .frontend.image.tag = \"$TAG\"
          " helm/hench/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/hench/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump image tags to sha-${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin main
