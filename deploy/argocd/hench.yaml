# ArgoCD Application for hench.
#
# Mirrors the convention in Gin-G/argo-k8s-stuff: copy this into
# `personal/templates/hench.yaml` there (adapting to the Helm `enable`/values
# pattern used by the other personal apps), or apply it directly. It points
# ArgoCD at the `helm/hench` chart in this repo.
#
# Adjust `repoURL` / `targetRevision` to match your fork.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hench
  namespace: argo
spec:
  destination:
    namespace: hench
    server: https://kubernetes.default.svc
  project: default
  source:
    path: helm/hench
    repoURL: https://github.com/Gin-G/hench
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
