app:
  name: hench
  group: personal
backend:
  enabled: true
  image:
    repository: ncging/hench-backend
    # Bumped to the commit SHA by .github/workflows/build-deploy.yml on each
    # push to main; ArgoCD picks up the change.
    tag: sha-ec64dea
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  env:
    LOG_LEVEL: info
    PLAID_ENV: production
    PLAID_PRODUCTS: '["transactions"]'
    # Consented at Link time, billed only when the endpoint is first called.
    # Must be set before the first bank is linked — the products an Item was
    # created with are fixed, so adding this later means re-authenticating
    # every institution through Link update mode.
    PLAID_ADDITIONAL_CONSENTED_PRODUCTS: '["liabilities"]'
    PLAID_COUNTRY_CODES: '["US"]'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  enabled: true
  image:
    repository: ncging/hench-frontend
    tag: sha-ec64dea
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80
  fqdn: hench.nickknows.net
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
# Nightly transactions sync (k8s CronJob running the CLI entrypoint).
sync:
  enabled: true
  schedule: "0 7 * * *" # 07:00 UTC nightly
ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-cloudflare
  externalDnsTarget: "75c20a42-2dd1-4297-8a51-3aefbcb3f004.cfargotunnel.com"
  # HTTP basic auth across the whole vhost. Superseded by Cloudflare Access
  # (cfAccess below) and kept only as a fallback: re-enabling it stacks a
  # second password prompt on top of Access. Credentials live in OpenBao
  # (secrets.basicAuthPath), never here.
  basicAuth:
    enabled: false
    realm: hench
# Cloudflare Access (Google login) in front of hench.nickknows.net. Access
# rejects anyone off the allow-list at the edge, and the backend re-verifies
# the signed Cf-Access-Jwt-Assertion on every request, so a request that
# reaches Traefik any other way still gets a 401. None of these are secrets:
# the token signature is what's checked, not knowledge of the AUD.
cfAccess:
  teamDomain: silent-field-be08.cloudflareaccess.com
  # Application Audience (AUD) tag from Zero Trust > Access > Applications >
  # hench > Overview. Rendering fails until it is set.
  aud: "67dabe01c37ac2b4ef2e2903add1bb43b78d3eeefc6f6ccdb05d88ee2c8f9765"
  # Checked by the API in addition to the Access policy, so loosening the
  # policy by mistake does not expose bank data.
  allowedEmails:
    - nickco7@gmail.com
# Namespace-local firewall. BasicAuth is enforced at the ingress, so without
# this anything already running in the cluster can reach the API and the
# database directly and route around it entirely.
networkPolicy:
  enabled: true
  # Namespace the ingress controller runs in — the only permitted source of
  # HTTP traffic to the API and UI.
  ingressControllerNamespace: traefik
  cnpgOperatorNamespace: cnpg
  # Node addresses, allowed so kubelet probes survive even if Cilium's host
  # firewall is ever enabled. Update these if the cluster gains nodes.
  nodeCIDRs:
    - 192.168.4.45/32
    - 192.168.4.57/32
    - 192.168.5.120/32
# OpenBao (via ESO) — PLAID_CLIENT_ID / PLAID_SECRET / FERNET_KEY live under
# this kv path with the property names below.
secrets:
  secretPath: hench/plaid
  clientIdKey: client_id
  secretKey: secret
  fernetKey: fernet_key
  # htpasswd lines for the ingress basic-auth middleware.
  basicAuthPath: hench/basicauth
  basicAuthUsersKey: users
  # Which store the ExternalSecret reads through. The default is the
  # cluster-wide store defined in Gin-G/argo-k8s-stuff
  # (manifests/external-secrets), which uses OpenBao's Kubernetes auth method -
  # no openbao-credentials secret is needed in this namespace.
  store:
    name: openbao-k8s-backend
    kind: ClusterSecretStore
    # Render a namespaced, token-authenticated SecretStore instead. Requires an
    # openbao-credentials secret in this namespace, created out of band.
    create: false
cnpg:
  enabled: true
  instances: 1
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
  # Bounds added 2026-08-18. Observed peak working set was 94Mi
  # (postgres runs shared_buffers=128MB + work_mem=4MB), so 256Mi requests
  # sits above real usage and the 1Gi limit leaves ~10x headroom for vacuum,
  # index builds and query bursts. CPU limit is loose on purpose: throttling
  # a database is worse than the overcommit it prevents.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    shared_buffers: "128MB"
    effective_cache_size: "256MB"
  backup:
    enabled: true
    retentionPolicy: "7d"
    snapshotClass: rook-ceph-block
