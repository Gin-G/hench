{{- if .Values.secrets.store.create }}
# Namespaced, token-authenticated store. Off by default: the cluster provides
# openbao-k8s-backend, a ClusterSecretStore that authenticates with the
# Kubernetes auth method and needs no token secret in this namespace.
#
# Only enable this if hench needs an OpenBao policy narrower than the shared
# one - and then create the openbao-credentials secret to go with it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secrets.store.name }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      auth:
        tokenSecretRef:
          key: OPENBAO_TOKEN
          name: openbao-credentials
      path: kv
      server: http://openbao.openbao.svc.cluster.local:8200
      version: v2
{{- end }}
