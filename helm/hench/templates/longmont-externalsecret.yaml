{{- if .Values.longmont.enabled }}
# City of Longmont utility portal login, for reading the current bill. Kept
# apart from the Plaid ExternalSecret so a missing or misnamed OpenBao path
# here cannot stop Plaid's secrets from syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hench.longmontSecret" . }}-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hench.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.store.name }}
    kind: {{ .Values.secrets.store.kind }}
  target:
    name: {{ include "hench.longmontSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: LONGMONT_USERNAME
      remoteRef:
        key: {{ .Values.longmont.secretPath }}
        property: {{ .Values.longmont.usernameKey }}
    - secretKey: LONGMONT_PASSWORD
      remoteRef:
        key: {{ .Values.longmont.secretPath }}
        property: {{ .Values.longmont.passwordKey }}
{{- end }}
