{{- if .Values.google.enabled }}
# Google OAuth client for read-only Gmail (bill reminder emails). Separate from
# the Plaid ExternalSecret so a missing path here cannot stall Plaid's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hench.googleSecret" . }}-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hench.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.store.name }}
    kind: {{ .Values.secrets.store.kind }}
  target:
    name: {{ include "hench.googleSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: {{ .Values.google.secretPath }}
        property: {{ .Values.google.clientIdKey }}
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.google.secretPath }}
        property: {{ .Values.google.clientSecretKey }}
{{- end }}
