{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    group: {{ .Values.app.group }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.ingress.externalDnsTarget | quote }}
    {{- /*
      Middleware order is significant and Traefik applies them left to right,
      so basic auth has to precede the path rewrite: an unauthenticated
      request must be rejected before any routing work happens. The annotation
      covers every router this Ingress creates, so the UI at / is gated too,
      not just /api.
    */}}
    {{- $mw := list }}
    {{- if .Values.ingress.basicAuth.enabled }}
    {{- $mw = append $mw (printf "%s-%s-basic-auth@kubernetescrd" .Release.Namespace .Values.app.name) }}
    {{- end }}
    {{- if .Values.backend.enabled }}
    {{- $mw = append $mw (printf "%s-%s-strip-api@kubernetescrd" .Release.Namespace .Values.app.name) }}
    {{- end }}
    {{- if $mw }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $mw | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.frontend.fqdn }}
      secretName: {{ .Values.app.name }}-tls
  rules:
    - host: {{ .Values.frontend.fqdn }}
      http:
        paths:
          {{- if .Values.backend.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app.name }}-backend
                port:
                  number: {{ .Values.backend.port }}
          {{- end }}
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app.name }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
          {{- end }}
{{- end }}
