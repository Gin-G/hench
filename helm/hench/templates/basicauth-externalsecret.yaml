{{- if .Values.ingress.basicAuth.enabled }}
{{/*
htpasswd credentials for the ingress basic-auth middleware.

The `users` property in OpenBao holds htpasswd-format lines, e.g.
    nick:$apr1$....
Write it with:
    bao kv put <mount>/hench/basicauth users='nick:$apr1$...'
Traefik accepts MD5 (apr1), SHA1 and bcrypt hashes. Never put the plaintext
password, or the hash, in values.yaml — this chart is in a public repo.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hench.basicAuthSecret" . }}-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hench.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.store.name }}
    kind: {{ .Values.secrets.store.kind }}
  target:
    name: {{ include "hench.basicAuthSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: {{ .Values.secrets.basicAuthPath }}
        property: {{ .Values.secrets.basicAuthUsersKey }}
{{- end }}
