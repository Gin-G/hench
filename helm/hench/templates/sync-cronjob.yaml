{{- if and .Values.backend.enabled .Values.sync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.app.name }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hench.labels" . | nindent 4 }}
    component: sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "hench.labels" . | nindent 12 }}
            component: sync
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.cli", "sync"]
              env:
                {{- include "hench.backendEnv" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backend.resources | nindent 16 }}
{{- end }}
