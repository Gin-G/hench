# Local development: Postgres + API (migrations + live reload) + the Vite
# dev server for the frontend. Open http://localhost:5173.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hench
      POSTGRES_PASSWORD: hench
      POSTGRES_DB: hench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hench"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hench:hench@db:5432/hench
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      FERNET_KEY: ${FERNET_KEY:-}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      CORS_ORIGINS: '["http://localhost:5173"]'
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - api
    environment:
      # Vite proxies /api here (and strips the prefix) — see vite.config.js.
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container builds its own (musl) node_modules
      # instead of reusing the host's.
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
