server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-asset routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api is routed to the backend Service by the Traefik ingress (which also
    # strips the /api prefix), so nginx never needs to proxy it here.
}
